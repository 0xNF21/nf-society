name: Payouts Monitor

# Manual safety job for /api/cron/payouts-monitor. The previous 5-minute
# schedule kept Neon compute warm on the free plan, so it is intentionally
# disabled. Use workflow_dispatch when payouts/refunds need an ops nudge.
#
# It pings the endpoint to:
#  1) confirm "sending" payouts that have been mined on Gnosis
#  2) retry "failed" payouts (attempts < 3, last update > 2 min)
#
# The Vercel cron at 4am still runs as the low-frequency safety net.

on:
  workflow_dispatch: # allow manual trigger from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit payouts monitor endpoint
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://nf-society.vercel.app/api/cron/payouts-monitor)
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" -ne 200 ]; then
            exit 1
          fi
